<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>타이베이 여행 가이드</title>
<meta name="description" content="구역별로 정리한 타이베이 주요 관광지 가이드">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --blue:#3182f6; --blue-weak:#e8f3ff; --ink:#191f28; --ink2:#4e5968; --ink3:#8b95a1;
  --bg:#f2f4f6; --card:#fff; --line:#e5e8eb; --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:20;background:rgba(242,244,246,.88);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px)}
header.top .wrap{height:56px;display:flex;align-items:center;justify-content:space-between}
header.top b{font-size:17px;font-weight:700}
header.top span{font-size:13px;color:var(--ink3);font-weight:500;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{padding:40px 0 24px}
.hero small{display:inline-block;color:var(--blue);font-weight:700;font-size:14px;margin-bottom:10px}
.hero h1{font-size:30px;line-height:1.3;font-weight:800;letter-spacing:-.03em}
.hero p{margin-top:12px;color:var(--ink2);font-size:16px}
.stats{display:flex;gap:10px;margin-top:22px}
.stats div{flex:1;background:var(--card);border-radius:16px;padding:14px 16px}
.stats b{display:block;font-size:20px;font-weight:800}
.stats span{font-size:13px;color:var(--ink3)}
.card{background:var(--card);border-radius:var(--r);padding:24px 20px;margin-bottom:14px}
.area{margin-top:36px}
.area-head{margin-bottom:14px}
.area-head .no{font-size:13px;font-weight:700;color:var(--blue)}
.area-head h2{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.area-head ul{margin-top:10px;list-style:none}
.area-head li{color:var(--ink2);font-size:15px;padding-left:14px;position:relative;margin-top:4px}
.area-head li:before{content:"";position:absolute;left:0;top:11px;width:4px;height:4px;border-radius:50%;background:var(--ink3)}
.map{display:grid;gap:10px;margin:14px 0}
.map img{width:100%;border-radius:16px;display:block;background:#e5e8eb}
.spot h3{font-size:19px;font-weight:700;letter-spacing:-.02em;display:flex;gap:8px;align-items:center}
.spot h3 i{font-style:normal;flex:none;width:26px;height:26px;border-radius:9px;background:var(--blue-weak);color:var(--blue);font-size:14px;font-weight:700;display:grid;place-items:center}
.spot ul{list-style:none;margin-top:14px}
.spot li{font-size:15px;color:var(--ink2);padding:9px 0 9px 16px;position:relative;border-top:1px solid #f2f4f6}
.spot li:first-child{border-top:0}
.spot li:before{content:"";position:absolute;left:0;top:19px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:16px -20px 0;padding:0 20px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;height:190px;width:auto;max-width:82%;object-fit:cover;border-radius:14px;scroll-snap-align:start;background:#e5e8eb;cursor:zoom-in}
.linkbtn{display:inline-flex;margin-top:14px;font-size:14px;font-weight:600;color:var(--blue);background:var(--blue-weak);padding:9px 14px;border-radius:12px;text-decoration:none}
footer{padding:32px 0 140px;color:var(--ink3);font-size:13px;text-align:center}
footer a{color:var(--ink2)}

/* 메뉴 버튼 */
.fab{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;border:0;background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:15px;padding:14px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center;cursor:pointer;transition:transform .15s}
.fab:active{transform:translateX(-50%) scale(.96)}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:28px 28px 0 0;max-height:82vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
body.open .dim{opacity:1;pointer-events:auto}
body.open .sheet{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 8px}
.sheet .sh b{font-size:20px;font-weight:800}
.sheet .x{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--ink2);cursor:pointer}
.sheet .body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom))}
.acc{border-radius:16px}
.acc{padding:6px 0 10px;border-top:1px solid var(--bg)}
.acc:first-child{border-top:0}
.acc>.ah{display:flex;align-items:center;gap:10px;padding:10px 8px 8px;font-size:16px;font-weight:700;color:var(--ink)}
.acc>.ah em{font-style:normal;font-size:13px;color:var(--blue);font-weight:700;width:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 8px 6px 38px}
.chips a{font-size:14px;font-weight:600;color:var(--ink2);background:var(--bg);padding:8px 13px;border-radius:999px;text-decoration:none}
.chips a:active,.chips a.all{background:var(--blue-weak);color:var(--blue)}

/* 라이트박스 */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:12px}

/* PC 마우스 드래그 */
.gallery{cursor:grab}
.gallery.drag{cursor:grabbing;scroll-snap-type:none}
.gallery img{-webkit-user-drag:none;user-select:none}
/* 라이트박스 화살표 */
.lb img{user-select:none;-webkit-user-drag:none}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.lb .nav:hover{background:rgba(255,255,255,.3)}
.lb .prev{left:16px}.lb .next{right:16px}
.lb .lbx{top:16px;right:16px;transform:none;width:40px;height:40px;font-size:18px}
.lb .cnt{position:absolute;top:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;font-weight:600;background:rgba(255,255,255,.14);padding:4px 12px;border-radius:999px}
.lb.single .nav.prev,.lb.single .nav.next{display:none}
@media (max-width:600px){.lb .nav{width:40px;height:40px;font-size:22px}.lb .prev{left:8px}.lb .next{right:8px}}
</style>
</head>

<header class="top"><div class="wrap"><a href="index.html" style="font-size:14px;font-weight:600;color:var(--blue);text-decoration:none">← 여행 일정표</a><span id="now"></span></div></header>

<main class="wrap">

    <p>10개 구역으로 나눠 정리한 주요 관광지예요. 아래 메뉴 버튼으로 원하는 곳에 바로 이동해 보세요.</p>

</main>

<button class="fab" id="fab" aria-label="메뉴 열기">

<div class="dim" id="dim"></div>

const $ = s => document.querySelector(s);
// 이미지를 전부 jpg로 변환한 경우를 위해: 확장자를 .jpg로 바꿔 먼저 시도하고,
// 실패하면 다른 변형(.jpeg, .JPG, 원본명 등)을 차례로 시도한 뒤 마지막에 숨김 처리
function cands(n){
  const base = n.replace(/\.(png|jpe?g|webp|avif|gif)$/i, "");
  return [...new Set([base+".jpg", n+".jpg", base+".jpeg", base+".JPG", n])];
}
function imgFail(el){
  const c = cands(el.dataset.n), i = (+el.dataset.i||0) + 1;
  if(i < c.length){ el.dataset.i = i; el.src = IMG + c[i]; }
  else { el.remove(); cleanup(); }
}
const imgTag = (n, cls="") => `<img loading="lazy" src="${IMG+cands(n)[0]}" data-n="${n}" data-i="0" alt="" ${cls} onerror="imgFail(this)">`;

// 본문 렌더
let spotCount = 0;
$("#topmaps").innerHTML = TOP_MAPS.map(n => imgTag(n)).join("");
$("#content").innerHTML = AREAS.map((a, ai) => {
  const head = `
  <div class="area-head"><div class="no">${String(ai+1).padStart(2,"0")}</div><h2>${a.name}</h2>
  ${a.intro.length ? `<ul>${a.intro.map(t=>`<li>${t}</li>`).join("")}</ul>` : ""}</div>
  <div class="map">${a.maps.map(n=>imgTag(n)).join("")}</div>`;
  const spots = a.spots.map((s, si) => {
    spotCount++;
    s.id = `s-${ai}-${si}`;
    return `<article class="card spot" id="${s.id}">
      <h3><i>${si+1}</i>${s.name}</h3>
      <ul>${s.pts.map(t=>`<li>${t}</li>`).join("")}</ul>
      ${s.imgs.length ? `<div class="gallery">${s.imgs.map(n=>imgTag(n)).join("")}</div>` : ""}
      ${s.link ? `<a class="linkbtn" href="${s.link[0]}" target="_blank" rel="noopener">${s.link[1]} ↗</a>` : ""}
    </article>`;
  }).join("");
  return `<section class="area" id="a-${ai}" data-name="${a.name}">${head}${spots}</section>`;
}).join("");
$("#nArea").textContent = AREAS.length;
$("#nSpot").textContent = spotCount;

// 이미지가 없으면 빈 갤러리·지도 영역 정리
function cleanup(){
  document.querySelectorAll(".gallery,.map").forEach(g => { if(!g.querySelector("img")) g.style.display="none"; });
}

// 메뉴 렌더
$("#menu").innerHTML = AREAS.map((a, ai) => `
  <div class="acc" data-i="${ai}">
    <div class="ah"><em>${String(ai+1).padStart(2,"0")}</em><span>${a.name}</span></div>
    <div class="chips">
      <a class="all" href="#a-${ai}">구역 전체</a>
      ${a.spots.map(s=>`<a href="#${s.id}">${s.name.replace(/ \(.*\)/,"")}</a>`).join("")}
    </div>
  </div>`).join("");

const open = v => document.body.classList.toggle("open", v);
$("#fab").onclick = () => open(true);
$("#dim").onclick = $("#close").onclick = () => open(false);
document.addEventListener("keydown", e => { if(e.key==="Escape"){ open(false); $("#lb").classList.remove("on"); }});
$("#menu").addEventListener("click", e => {
  if(e.target.closest(".chips a")) setTimeout(()=>open(false),50);
});

// 현재 구역 표시
const io = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting) $("#now").textContent = en.target.dataset.name; }),
  {rootMargin:"-30% 0px -60% 0px"});
document.querySelectorAll(".area").forEach(el => io.observe(el));

// 갤러리 마우스 드래그 (PC)
let dragEl=null, sx=0, sl=0, moved=false;
document.addEventListener("dragstart", e => { if(e.target.closest(".gallery")) e.preventDefault(); });
document.addEventListener("mousedown", e => {
  const g = e.target.closest(".gallery");
  if(!g || e.button !== 0) return;
  dragEl = g; sx = e.pageX; sl = g.scrollLeft; moved = false;
});
window.addEventListener("mousemove", e => {
  if(!dragEl) return;
  const dx = e.pageX - sx;
  if(!moved && Math.abs(dx) > 5){ moved = true; dragEl.classList.add("drag"); }
  if(moved) dragEl.scrollLeft = sl - dx;
});
window.addEventListener("mouseup", () => {
  if(!dragEl) return;
  dragEl.classList.remove("drag"); dragEl = null;
  setTimeout(() => moved = false, 0);   // 드래그 직후의 click은 무시
});

// 사진 크게 보기 + 이전/다음
let lbList = [], lbIdx = 0;
const lbEl = $("#lb");
function lbShow(i){
  lbIdx = (i + lbList.length) % lbList.length;
  $("#lbImg").src = lbList[lbIdx].src;
  $("#lbCnt").textContent = (lbIdx+1) + " / " + lbList.length;
}
function lbClose(){ lbEl.classList.remove("on"); }
document.addEventListener("click", e => {
  if(moved) return;
  const im = e.target.closest(".gallery img, .map img");
  if(im){
    lbList = [...im.parentElement.querySelectorAll("img")];
    lbEl.classList.toggle("single", lbList.length < 2);
    lbShow(lbList.indexOf(im));
    lbEl.classList.add("on");
  }
});
$("#lbPrev").onclick = e => { e.stopPropagation(); lbShow(lbIdx - 1); };
$("#lbNext").onclick = e => { e.stopPropagation(); lbShow(lbIdx + 1); };
$("#lbX").onclick = e => { e.stopPropagation(); lbClose(); };
lbEl.addEventListener("click", e => { if(e.target === lbEl) lbClose(); });
document.addEventListener("keydown", e => {
  if(!lbEl.classList.contains("on")) return;
  if(e.key === "ArrowLeft") lbShow(lbIdx - 1);
  if(e.key === "ArrowRight") lbShow(lbIdx + 1);
});
let tx = 0;
lbEl.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, {passive:true});
lbEl.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx;
  if(Math.abs(dx) > 50 && lbList.length > 1) lbShow(lbIdx + (dx < 0 ? 1 : -1));
});
</script>
</body>
</html>
